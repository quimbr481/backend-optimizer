<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>BZ7 • Painel do Dono</title>
<style>
:root{--bg:#07090d;--p:#0e131b;--l:#1b2433;--t:#e6edf7;--m:#8393a9;--a:#3b82ff;--ok:#2ecf91;--w:#ffb454;--b:#ff5d73}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--l)}header b{letter-spacing:.2em}header nav{display:flex;gap:6px}
nav button{background:none;border:0;color:var(--m);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}nav button.on{background:#14203a;color:#fff}
main{padding:24px;max-width:1280px;margin:auto}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}.stats b{font-size:28px;display:block}.stats span{color:var(--m);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--m);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--l)}td{padding:8px;border-bottom:1px solid #121a27;vertical-align:middle}tr:hover td{background:#0f1622}
input,select{background:#0a0f17;border:1px solid var(--l);color:var(--t);border-radius:8px;padding:8px 10px;font:inherit}label{font-size:12px;color:var(--m);display:block}
button.b{background:var(--a);border:0;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:600 13px inherit}button.b.g{background:#1a2538}button.b.d{background:#6b1f2c}button.b.s{padding:4px 9px;font-size:12px}
.tag{padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid var(--l);color:var(--m)}.ok{color:var(--ok);border-color:var(--ok)}.w{color:var(--w);border-color:var(--w)}.bad{color:var(--b);border-color:var(--b)}
code{background:#0a0f17;padding:2px 6px;border-radius:6px;user-select:all}#login{max-width:340px;margin:12vh auto}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center}.modal>div{background:var(--p);border:1px solid var(--a);border-radius:14px;padding:22px;max-width:640px;width:92%;max-height:84vh;overflow:auto}
#toast{position:fixed;right:18px;bottom:18px;background:#14203a;border:1px solid var(--a);padding:10px 14px;border-radius:10px;display:none}
</style></head><body>
<div id="login" class="card"><h2 style="margin-top:0">BZ7 • Painel do Dono</h2><label>Senha do painel</label><input id="pw" type="password" style="width:100%;margin:6px 0 12px"><button class="b" id="go" style="width:100%">Entrar</button><div id="lerr" style="color:var(--b);margin-top:8px"></div></div>
<div id="app" style="display:none"><header><b>BZ7 ADMIN</b><nav id="nav"></nav><span style="margin-left:auto;color:var(--m)">somente neste computador</span></header><main id="main"></main></div>
<div id="modal" class="modal" style="display:none"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(r,b){const x=await fetch('/api/'+r,{method:'POST',headers:{'Content-Type':'application/json','x-bz7':'1'},body:JSON.stringify(b||{})});const j=await x.json();if(x.status===401&&r!=='login'){location.reload();}if(!x.ok)throw new Error(j.error||'erro');return j.result??j;}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500);}
const PLAN={daily:'Diária',weekly:'Semanal',monthly:'Mensal',yearly:'Anual',lifetime:'Lifetime'};
const fd=t=>t?new Date(t).toLocaleString('pt-BR'):'—';
$('#go').onclick=async()=>{try{await api('login',{password:$('#pw').value});$('#login').style.display='none';$('#app').style.display='block';tab('over');}catch(e){$('#lerr').textContent=e.message}};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
const TABS={over:'Visão geral',keys:'Keys',acc:'Contas'};
function tab(t){$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===t?'on':''}" onclick="tab('${k}')">${v}</button>`).join('');({over,keys,acc})[t]().catch(e=>toast(e.message));}
async function over(){const o=await api('overview');$('#main').innerHTML=`<div class="stats">${[['accounts','Contas'],['activeLicenses','Licenças ativas'],['keys','Keys geradas'],['unused','Keys não usadas'],['used','Keys usadas']].map(([k,l])=>`<div class="card"><b>${o[k]}</b><span>${l}</span></div>`).join('')}</div>`;}
function modal(h){const m=$('#modal');m.innerHTML='<div>'+h+'<div style="text-align:right;margin-top:14px"><button class="b g" onclick="$(\'#modal\').style.display=\'none\'">Fechar</button></div></div>';m.style.display='flex';}
async function keys(){const l=await api('keys/list');
$('#main').innerHTML=`<div class="card"><h3 style="margin-top:0">Gerar keys</h3><div class="row"><div><label>Plano</label><select id="kp">${Object.entries(PLAN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div><label>Quantidade</label><input id="kq" type="number" value="1" min="1" max="500" style="width:90px"></div><div><label>Observação (cliente, pedido…)</label><input id="kn" style="width:260px"></div><button class="b" onclick="gen()">Gerar</button></div></div>
<div class="card" style="margin-top:16px"><table><tr><th>Key</th><th>Plano</th><th>Status</th><th>Obs.</th><th>Criada</th><th>Usada por</th><th></th></tr>${l.map(k=>`<tr><td><code>${esc(k.code)}</code></td><td>${PLAN[k.plan]||esc(k.plan)}</td><td>${k.revoked?'<span class="tag bad">cancelada</span>':k.redeemedBy?'<span class="tag w">usada</span>':'<span class="tag ok">disponível</span>'}</td><td>${esc(k.note)}</td><td>${fd(k.createdAt)}</td><td>${esc(k.redeemedEmail||'')}</td><td>${!k.redeemedBy&&!k.revoked?`<button class="b d s" onclick="rk('${k.id}')">Cancelar</button>`:''}</td></tr>`).join('')}</table></div>`;}
async function gen(){const r=await api('keys/gen',{plan:$('#kp').value,qty:+$('#kq').value,note:$('#kn').value});modal('<h3>Keys geradas — copie agora</h3><p style="color:var(--m)">Também salvas em keys-export-AAAA-MM-DD.csv nesta pasta.</p><pre style="user-select:all;font-size:15px">'+r.map(k=>esc(k.code)).join('\n')+'</pre>');keys();}
async function rk(id){if(confirm('Cancelar esta key?')){await api('keys/revoke',{id});keys();}}
async function acc(){const l=await api('accounts/list');
$('#main').innerHTML=`<div class="card"><input id="q" placeholder="filtrar por e-mail…" oninput="fq()" style="width:300px;margin-bottom:10px"><table id="at"><tr><th>E-mail</th><th>Verificado</th><th>Licença</th><th>Expira</th><th>PCs</th><th>Último login</th><th></th></tr>${l.map(a=>`<tr data-e="${esc((a.email||'').toLowerCase())}"><td>${esc(a.email)} ${a.disabled?'<span class="tag bad">bloqueada</span>':''}</td><td>${a.verified?'<span class="tag ok">sim</span>':'<span class="tag w">não</span>'}</td><td>${a.revoked?'<span class="tag bad">revogada</span>':a.active?'<span class="tag ok">'+(PLAN[a.plan]||a.plan)+'</span>':'<span class="tag">sem key</span>'}</td><td>${a.plan==='lifetime'&&a.active?'nunca':fd(a.expiresAt)}</td><td>${a.devices}</td><td>${fd(a.lastSignIn)}</td><td><button class="b g s" onclick="det('${a.uid}','${esc(a.email)}',${a.disabled})">Gerenciar</button></td></tr>`).join('')}</table></div>`;}
function fq(){const q=$('#q').value.toLowerCase();document.querySelectorAll('#at tr[data-e]').forEach(r=>r.style.display=r.dataset.e.includes(q)?'':'none');}
async function det(uid,email,dis){const d=await api('accounts/detail',{uid});const A=d.account||{devices:{}},Lc=d.license;
modal(`<h3 style="margin-top:0">${esc(email)}</h3><p>Licença: ${Lc?`<b>${PLAN[Lc.plan]||esc(Lc.plan)}</b>, expira ${Lc.plan==='lifetime'?'nunca':fd(Lc.expiresAt)} ${Lc.revoked?'<span class="tag bad">revogada</span>':''}`:'nenhuma'}</p>
<div class="row" style="margin-bottom:12px"><select id="gp">${Object.entries(PLAN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="b s" onclick="act('grant','${uid}',{plan:$('#gp').value})">Conceder/somar plano</button>${Lc&&!Lc.revoked?`<button class="b d s" onclick="act('revokeLicense','${uid}')">Revogar licença</button>`:''}${Lc&&Lc.revoked?`<button class="b s" onclick="act('restoreLicense','${uid}')">Restaurar</button>`:''}<button class="b g s" onclick="act('logoutAll','${uid}')">Deslogar tudo</button><button class="b ${dis?'':'d'} s" onclick="act('disable','${uid}',{disabled:${!dis}})">${dis?'Desbloquear conta':'Bloquear conta'}</button></div>
<table><tr><th>Dispositivo</th><th>Papel</th><th>Último uso</th><th></th></tr>${Object.entries(A.devices||{}).map(([id,v])=>`<tr><td>${esc(v.name)}<br><small style="color:var(--m)">${esc(id.slice(0,12))}…</small></td><td>${id===A.adminDeviceId?'<span class="tag ok">admin</span> ':''}${Lc&&id===Lc.activeDeviceId?'<span class="tag w">key</span>':''}</td><td>${fd(v.lastSeen)}</td><td><button class="b g s" onclick="dev('${uid}','${id}','admin')">Tornar admin</button> <button class="b g s" onclick="dev('${uid}','${id}','key')">Key aqui</button> <button class="b d s" onclick="dev('${uid}','${id}','remove')">Remover</button></td></tr>`).join('')||'<tr><td colspan=4>Nenhum dispositivo.</td></tr>'}</table>`);}
async function act(r,uid,x){try{await api('accounts/'+r,{uid,...(x||{})});toast('Feito.');$('#modal').style.display='none';acc();}catch(e){toast(e.message)}}
async function dev(uid,deviceId,op){try{await api('accounts/device',{uid,deviceId,op});toast('Feito.');$('#modal').style.display='none';acc();}catch(e){toast(e.message)}}
</script></body></html>
